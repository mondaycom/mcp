  logs {
  timestamp
  event
  ip_address
  user {
  id
  name
  email
  }
  activity_metadata
  }
  pagination {
  page
  page_size
  has_more_pages
  next_page_number
  }
  }
  }

  To get the list of all possible event types, you should use the audit_event_catalogue query like this:

  query {
  audit_event_catalogue {
  name
