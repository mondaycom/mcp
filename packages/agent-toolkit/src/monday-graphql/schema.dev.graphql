"Root mutation type for the Dependencies service"
type Mutation {
  "Submit answers to a form. Open to authenticated and anonymous users — authorization is handled by the form settings (user restrictions, etc.). Note: forms with reCAPTCHA enabled cannot be submitted via GraphQL — use the UI instead."
  create_form_submission(  "The unique token identifying the form to submit to."
form_token: String!,   "The answers to submit. Each entry specifies a question ID and the answer for that question."
answers: [FormAnswerInput!]!,   "The timezone offset of the submitter in minutes (e.g. -120 for UTC-2)."
form_timezone_offset: Int!,   "The password for the form. Required if the form is password-protected."
password: String,   "The board group ID to submit the response into."
group_id: ID,   "Tags to attach to the submission — metadata mapped to specific board columns."
tags: [TagInput!]): FormSubmissionResult
  "Update form properties including title, description, or question order."
  update_form(  "The unique identifier token for the form. Required for all form-specific operations."
formToken: String!,   "Complete form configuration object containing properties to create or update."
input: UpdateFormInput!): ResponseForm
  "Update form configuration including features, appearance, and accessibility options."
  update_form_settings(  "The unique identifier token for the form. Required for all form-specific operations."
formToken: String!,   "Complete form settings object containing all configuration options."
settings: UpdateFormSettingsInput!): ResponseForm
  "Create a new question within a form. Returns the created question with auto-generated ID."
  create_form_question(  "The unique identifier token for the form. Required for all form-specific operations."
formToken: String!,   "Complete question object containing all properties for creation or update."
question: CreateQuestionInput!): FormQuestion
  "Update an existing question properties including title, type, or settings. Requires question ID."
  update_form_question(  "The unique identifier token for the form. Required for all form-specific operations."
formToken: String!,   "The unique identifier for the question. Used to target specific questions within a form."
questionId: String!,   "Complete question object containing all properties for creation or update."
question: UpdateQuestionInput!): FormQuestion
  "Permanently remove a question from a form. This action cannot be undone."
  delete_question(  "The unique identifier token for the form. Required for all form-specific operations."
formToken: String!,   "The unique identifier for the question. Used to target specific questions within a form."
questionId: String!): Boolean
  "Activate a form to make it visible to users and accept new submissions."
  activate_form(  "The unique identifier token for the form. Required for all form-specific operations."
formToken: String!): Boolean
  "Deactivate a form to hide it from users and stop accepting submissions. Form data is preserved."
  deactivate_form(  "The unique identifier token for the form. Required for all form-specific operations."
formToken: String!): Boolean
  "Shorten a URL for a form and store it in the form settings. Returns the shortened link object."
  shorten_form_url(  "The unique identifier token for the form. Required for all form-specific operations."
formToken: String!): FormShortenedLink
  "Create a new tag for a form. Tags are used to categorize and track responses. (e.g. UTM tags)"
  create_form_tag(  "The unique identifier token for the form. Required for all form-specific operations."
formToken: String!,   "The tag data to create"
tag: CreateFormTagInput!): FormTag
  "Delete a tag from a form"
  delete_form_tag(  "The unique identifier token for the form. Required for all form-specific operations."
formToken: String!,   "The unique identifier for the tag"
tagId: String!,   "Options for deleting the tag"
options: DeleteFormTagInput): Boolean
  "Create a new form with specified configuration. Returns the created form with its unique token."
  create_form(  "The workspace in which the form will be created in."
destination_workspace_id: ID!,   "The folder in which the form will be created under."
destination_folder_id: ID,   "The name of the folder in which the form will be created in."
destination_folder_name: String,   "The board kind to create for the board in which the form will create items in."
board_kind: BoardKind,   "The name of the board that will be created to store the form responses in."
destination_name: String,   "Array of user IDs who will have owner permissions on the board in which the form will create items in."
